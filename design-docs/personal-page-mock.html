<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hayda Min - Person Details</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Define Style Guide Option 1 */
        :root {
            --color-bg: #FAF7F5; /* Oat */
            --color-bg-card: #F4F1EE; /* Light Oat */
            --color-text: #4E4A47; /* Coffee Bean */
            --color-accent: #5F8575; /* Sage Green */
        }
        
        .font-sans {
            font-family: 'Poppins', sans-serif;
        }
        .font-arabic {
            font-family: 'Tajawal', sans-serif;
        }
        
        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Poppins', sans-serif;
            font-size: 18px; /* Larger base font size for readability */
        }

        /* Simple reveal animation for "Who is this?" card */
        .reveal-card {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.5s ease-in-out;
        }
        .reveal-card.show {
            max-height: 500px; /* arbitrary large value */
            opacity: 1;
        }

        /* --- Gallery Modal Styles --- */
        .gallery-modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(78, 74, 71, 0.9); /* Coffee Bean with transparency */
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content {
            position: relative;
            margin: auto;
            padding: 20px;
            width: 90%;
            max-width: 900px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-image {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .close-button {
            position: absolute;
            top: -20px;
            right: 0;
            color: #fff;
            font-size: 60px;
            font-weight: bold;
            transition: color 0.3s;
            cursor: pointer;
            z-index: 60;
        }
        .close-button:hover,
        .close-button:focus {
            color: #ccc;
            text-decoration: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* --- Page Layout & Components --- */
        .back-button {
            background-color: var(--color-bg-card);
            color: var(--color-accent);
            font-size: 1.5rem; /* 24px */
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .back-button:hover {
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            transform: scale(1.05);
        }

        /* REMOVED .main-photo styles, Tailwind will handle it */
        /* REMOVED .thumbnail styles */
        
        .info-card {
            background-color: var(--color-bg-card);
            border-radius: 1.5rem; /* 24px */
            padding: 2rem; /* 32px */
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .family-link {
            transition: all 0.3s ease;
            border-radius: 0.75rem; /* 12px */
            overflow: hidden;
        }
        .family-link:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        
        .family-link img {
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .family-link-small {
            transition: all 0.3s ease;
            border-radius: 0.75rem; /* 12px */
            overflow: hidden;
            width: 160px; /* 10rem */
            flex-shrink: 0; /* Prevent shrinking in flex container */
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .family-link-small:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .family-link-small img {
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

    </style>
</head>
<body class="p-6 md:p-12">

    <!-- Back Button -->
    <a href="#" class="back-button mb-8" aria-label="Go Back">
        <!-- Heroicons: Arrow Left -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-8 h-8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>

    <!-- Main Page Container (iPad-first grid) -->

        <!-- Top Card: Profile + Interaction + About -->

                <!-- Profile Photo (Clickable for Gallery) -->
                <img id="main-photo" src="https://placehold.co/800x800/d4a373/faf7f5?text=Main+Photo" alt="Main photo of Layla" 
                     class="open-gallery w-48 h-48 md:w-64 md:h-64 rounded-full object-cover shadow-lg cursor-pointer transition-transform duration-300 ease-out hover:scale-105 hover:shadow-xl flex-shrink-0" 
                     data-img-src="https://placehold.co/800x800/d4a373/faf7f5?text=Main+Photo">

                <!-- Right Column: Interaction + About -->

                    <!-- Interaction Block -->
                    <div class="flex-1 w-full flex flex-col gap-6">
                        <!-- "Who is this?" Button -->
                        <button id="reveal-button" class="font-arabic text-4xl font-bold py-8 px-12 rounded-2xl shadow-lg transition-transform duration-300 ease-out hover:shadow-xl hover:-translate-y-1 w-full"

                            <p id="person-relationship-ar" class="font-arabic text-4xl mt-2" style="color: var(--color-accent);" dir="rtl">ابنتك</p>
                        </div>
                    </div>

                    <!-- About Card Content (MOVED) -->
                    <div>
                        <h3 class="font-sans text-4xl font-bold mb-6">About</h3>
                        <div class="space-y-6 text-2xl">
                            <div class="flex">
                                <span class="w-32 font-semibold flex-shrink-0">Name:</span>
                                <span id="person-name" class="font-sans">Layla</span>
                            </div>
                            <div class="flex">
                                <span class="w-32 font-semibold flex-shrink-0">Birthday:</span>
                                <span id="person-birthday" class="font-sans">May 10, 1975</span>
                            </div>
                            <div class="flex">
                                <span class="w-32 font-semibold flex-shrink-0">Age:</span>
                                <span id="person-age" class="font-sans">49</span>
                            </div>
                            <div class="flex">
                                <span class="w-32 font-semibold flex-shrink-0">Lives in:</span>
                                <span id="person-location" class="font-sans">Beirut, Lebanon</span>
                            </div>
                            <div class="flex">
                                <span class="w-32 font-semibold flex-shrink-0">Loves:</span>
                                <span id="person-food" class="font-sans">Knafeh</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- NEW Family Card -->
        <div id="family-card-container" class="info-card" style="display: none;"> <!-- Hide until populated -->
            <h3 class="font-sans text-4xl font-bold mb-6">Family</h3>
            <div id="family-scroll-container" class="flex overflow-x-auto gap-6 pb-4">
                <!-- JS will populate this -->
            </div>
        </div>

        <!-- Bottom Grid: Details (REMOVED) -->
        <!-- <div class="grid grid-cols-1 lg:grid-cols-2 gap-10"> --> <!-- REMOVED GRID WRAPPER -->
            <!-- About Card (REMOVED) -->
            <!--
            <div class="info-card">
                <h3 class="font-sans text-4xl font-bold mb-6">About</h3>
                ...
            </div>
            -->
        <!-- </div> --> <!-- REMOVED GRID WRAPPER -->

    </div>

    <!-- Gallery Modal -->
    <div id="gallery-modal" class="gallery-modal">
        <span class="close-button" id="close-modal">&times;</span>
        <div class="modal-content">
            <img class="modal-image" id="modal-image-src" src="">
        </div>
    </div>

    <script>
        // --- Mock Data ---
        const personData = {
            name: "Layla Atieh",
            nameAr: "ليلى عطية",
            relationshipAr: "ابنتك",
            birthday: "1975-05-10",
            location: "Beirut, Lebanon",
            favoriteFood: "Knafeh",
            mainPhoto: "https://placehold.co/800x800/d4a373/faf7f5?text=Layla",
            gallery: [
                "https://placehold.co/800x800/d4a373/faf7f5?text=Layla",
                "https://placehold.co/800x800/a5a58d/faf7f5?text=Layla+with+family",
                "https://placehold.co/800x800/6b705c/faf7f5?text=Layla+Graduation",
                "https://placehold.co/800x800/b7b7a4/faf7f5?text=Younger+Layla"
            ],
            spouse: {
                nameAr: "زياد",
                relationshipAr: "زوجها",
                photo: "https://placehold.co/400x400/585123/faf7f5?text=Ziad",
                link: "#"
            },
            children: [
                {
                    nameAr: "إلياس",
                    photo: "https://placehold.co/300x300/eec170/4e4a47?text=Elias",
                    link: "#"
                },
                {
                    nameAr: "يارا",
                    photo: "https://placehold.co/300x300/f28482/faf7f5?text=Yara",
                    link: "#"
                }
            ]
        };

        // --- Utility Functions ---
        function calculateAge(birthdayString) {
            const birthday = new Date(birthdayString);
            const ageDifMs = Date.now() - birthday.getTime();
            const ageDate = new Date(ageDifMs);
            return Math.abs(ageDate.getUTCFullYear() - 1970);
        }

        // --- Load Data into UI ---
        function loadPersonData(data) {
            // About Card
            document.getElementById('person-name').textContent = data.name;
            document.getElementById('person-birthday').textContent = new Date(data.birthday).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('person-age').textContent = calculateAge(data.birthday);
            document.getElementById('person-location').textContent = data.location;
            document.getElementById('person-food').textContent = data.favoriteFood;

            // Reveal Card
            document.getElementById('person-name-ar').textContent = data.nameAr;
            document.getElementById('person-relationship-ar').textContent = data.relationshipAr;

            // Main Photo
            const mainPhotoEl = document.getElementById('main-photo');
            mainPhotoEl.src = data.mainPhoto;
            mainPhotoEl.alt = `Main photo of ${data.name}`;
            mainPhotoEl.dataset.imgSrc = data.mainPhoto;

            // Thumbnail Gallery - REMOVED
            /*
            const galleryEl = document.getElementById('thumbnail-gallery');
            galleryEl.innerHTML = ''; // Clear placeholders
            data.gallery.forEach((photoUrl, index) => {
                const img = document.createElement('img');
                img.src = photoUrl.replace('800x800', '200x200'); // Use smaller placeholder for thumbnail
                img.alt = `Gallery thumbnail ${index + 1}`;
                img.className = 'thumbnail open-gallery';
                img.dataset.imgSrc = photoUrl;
                galleryEl.appendChild(img);
            });
            */

            // --- NEW Family Card Logic ---
            const familyCardContainer = document.getElementById('family-card-container');
            const familyScrollContainer = document.getElementById('family-scroll-container');
            familyScrollContainer.innerHTML = ''; // Clear
            
            let hasFamily = false;

            // Family - Spouse
            if (data.spouse) {
                hasFamily = true;
                familyScrollContainer.innerHTML += `
                    <a href="${data.spouse.link}" class="family-link-small block">
                        <img src="${data.spouse.photo}" alt="Photo of ${data.spouse.nameAr}" class="w-full">
                        <div class="p-3 bg-white"> <!-- Smaller padding -->
                            <p class="font-arabic text-2xl font-bold text-center" dir="rtl">${data.spouse.nameAr}</p> <!-- Smaller text -->
                            <p class="font-arabic text-lg text-center" style="color: var(--color-accent);" dir="rtl">${data.spouse.relationshipAr}</p> <!-- Smaller text -->
                        </div>
                    </a>
                `;
            }

            // Family - Children
            if (data.children && data.children.length > 0) {
                hasFamily = true;
                data.children.forEach(child => {
                    familyScrollContainer.innerHTML += `
                        <a href="${child.link}" class="family-link-small block">
                            <img src="${child.photo}" alt="Photo of ${child.nameAr}" class="w-full">
                            <div class="p-3 bg-white"> <!-- Smaller padding -->
                                <p class="font-arabic text-2xl font-bold text-center" dir="rtl">${child.nameAr}</p> <!-- Smaller text -->
                            </div>
                        </a>
                    `;
                });
            }

            // Only show the family card if there are family members
            if (hasFamily) {
                familyCardContainer.style.display = 'block';
            }

            // --- REMOVE OLD Family Logic ---
            /*
            const spouseSection = document.getElementById('spouse-section');
            if (data.spouse) {
                spouseSection.innerHTML = `
                    <h4 class="font-sans text-2xl font-semibold mb-4">Spouse</h4>
                    <a href="${data.spouse.link}" class="family-link block max-w-xs shadow-md">
                        <img src="${data.spouse.photo}" alt="Photo of ${data.spouse.nameAr}" class="w-full">
                        <div class="p-4 bg-white">
                            <p class="font-arabic text-3xl font-bold text-center" dir="rtl">${data.spouse.nameAr}</p>
                            <p class="font-arabic text-xl text-center" style="color: var(--color-accent);" dir="rtl">${data.spouse.relationshipAr}</p>
                        </div>
                    </a>
                `;
            } else {
                spouseSection.style.display = 'none';
            }

            // Family - Children
            const childrenSection = document.getElementById('children-section');
            if (data.children && data.children.length > 0) {
                let childrenHtml = '<h4 class="font-sans text-2xl font-semibold mb-4">Children</h4><div class="grid grid-cols-2 gap-6">';
                data.children.forEach(child => {
                    childrenHtml += `
                        <a href="${child.link}" class="family-link block shadow-md">
                            <img src="${child.photo}" alt="Photo of ${child.nameAr}" class="w-full">
                            <div class="p-4 bg-white">
                                <p class="font-arabic text-3xl font-bold text-center" dir="rtl">${child.nameAr}</p>
                            </div>
                        </a>
                    `;
                });
                childrenHtml += '</div>';
                childrenSection.innerHTML = childrenHtml;
            } else {
                childrenSection.style.display = 'none';
            }
            */
        }

        // --- Event Listeners ---
        document.addEventListener('DOMContentLoaded', () => {
            // Load all the data
            loadPersonData(personData);

            // "Who is this?" button
            const revealButton = document.getElementById('reveal-button');
            const revealCard = document.getElementById('reveal-card');
            revealButton.addEventListener('click', () => {
                // revealCard.classList.toggle('show'); // OLD
                revealButton.style.display = 'none'; // NEW
                revealCard.classList.add('show'); // NEW
            });

            // Gallery Modal
            const modal = document.getElementById('gallery-modal');
            const modalImg = document.getElementById('modal-image-src');
            const closeModal = document.getElementById('close-modal');

            // Function to open the modal
            function openModal(e) {
                modal.style.display = 'block';
                modalImg.src = e.currentTarget.dataset.imgSrc;
            }

            // Function to close the modal
            function closeModalFunction() {
                modal.style.display = 'none';
            }

            // Attach listeners to all gallery images
            document.querySelectorAll('.open-gallery').forEach(item => {
                item.addEventListener('click', openModal);
            });

            // Close button listener
            closeModal.addEventListener('click', closeModalFunction);

            // Close modal by clicking background
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModalFunction();
                }
            });
            // Re-attach listeners after data load - NO LONGER NEEDED FOR THUMBNAILS
            /*
            document.querySelectorAll('.open-gallery').forEach(item => {
                item.removeEventListener('click', openModal); // Remove old listener
                item.addEventListener('click', openModal); // Add new listener
            });
            */
        });

    </script>

</body>
</html>
